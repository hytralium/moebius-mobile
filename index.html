<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moebius Web</title>
<meta name="description" content="Modelle einfach bilden und simulieren – Kleinschrittverfahren im Browser, kompatibel zu Moebius-Dateien (.prg).">
<meta name="theme-color" content="#f0f0f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Menüleiste -->
  <nav class="menubar" id="menubar" aria-label="Menü">
    <div class="menu"><button class="menu-btn"><u>D</u>atei</button>
      <div class="menu-list">
        <button data-act="new"><span><u>N</u>eu</span></button>
        <button data-act="open"><span>Ö<u>f</u>fnen…</span> <kbd>Strg+O</kbd></button>
        <div class="submenu"><button><span>Beispiel öffnen… ▸</span></button><div class="menu-list" id="exampleMenu"></div></div>
        <button data-act="save"><span><u>S</u>peichern</span> <kbd>Strg+S</kbd></button>
        <button data-act="saveAs"><span>Speichern <u>u</u>nter…</span></button>
        <button data-act="exportCsv"><span>Nach E<u>x</u>cel exportieren</span></button>
        <hr>
        <button data-act="printDlg"><span><u>D</u>rucken…</span> <kbd>Strg+P</kbd></button>
      </div>
    </div>
    <div class="menu"><button class="menu-btn"><u>B</u>earbeiten</button>
      <div class="menu-list">
        <button data-act="cut"><span><u>A</u>usschneiden</span> <kbd>Strg+X</kbd></button>
        <button data-act="copy"><span><u>K</u>opieren</span> <kbd>Strg+C</kbd></button>
        <button data-act="paste"><span><u>E</u>infügen</span> <kbd>Strg+V</kbd></button>
        <button data-act="del"><span><u>L</u>öschen</span> <kbd>Entf</kbd></button>
        <hr>
        <button data-act="rotate"><span><u>D</u>rehen</span></button>
        <hr>
        <button data-act="input"><span><u>S</u>imulation</span></button>
      </div>
    </div>
    <div class="menu"><button class="menu-btn"><u>A</u>nsicht</button>
      <div class="menu-list">
        <button data-act="showGraph"><span><u>S</u>chaubild</span></button>
        <button data-act="showTable"><span><u>T</u>abelle</span></button>
        <hr>
        <button data-act="toggleImmediate" class="chk-item" id="miImmediate"><span>sofort an<u>z</u>eigen</span></button>
        <button data-act="toggleAutoScale" class="chk-item" id="miAutoScale"><span><u>a</u>utomatisch skalieren</span></button>
        <hr>
        <button data-act="animStart"><span>Animation sta<u>r</u>ten</span></button>
        <button data-act="animPause" class="needs-anim"><span>Animation <u>P</u>ause</span></button>
        <button data-act="animStop" class="needs-anim"><span>Animation <u>b</u>eenden</span></button>
        <hr>
        <button data-act="redraw"><span><u>N</u>eu zeichnen</span></button>
      </div>
    </div>
    <div class="menu"><button class="menu-btn"><u>E</u>infügen</button>
      <div class="menu-list">
        <button data-act="newSim"><span><u>N</u>eue Simulation</span></button>
        <button data-act="dupSim"><span><u>K</u>opie der Simulation</span></button>
        <hr>
        <button data-act="insertImage"><span><u>G</u>rafik</span></button>
      </div>
    </div>
    <div class="menu"><button class="menu-btn"><u>F</u>ormat</button>
      <div class="menu-list">
        <button data-act="formatText"><span><u>T</u>ext</span></button>
        <button data-act="formatImage"><span><u>G</u>rafik</span></button>
        <hr>
        <button data-act="axisNumbers"><span>Zahlen an <u>A</u>chsen</span></button>
        <button data-act="toggleLegend" class="chk-item" id="miLegend"><span><u>L</u>egende</span></button>
        <button data-act="graphDlg"><span><u>S</u>chaubild</span></button>
        <hr>
        <button data-act="tableNumbers"><span><u>Z</u>ahlen in Tabelle</span></button>
      </div>
    </div>
    <div class="menu"><button class="menu-btn"><u>H</u>ilfe</button>
      <div class="menu-list">
        <button data-act="help"><span><u>I</u>nhalt</span> <kbd>F1</kbd></button>
        <button data-act="helpUsage"><span><u>B</u>edienung</span></button>
        <button data-act="helpIntro"><span><u>E</u>inführung in Moebius</span></button>
        <button data-act="helpSchool"><span>Moebius im <u>U</u>nterricht</span></button>
        <hr>
        <button data-act="about"><span>Info über…</span></button>
      </div>
    </div>
  </nav>

  <!-- Werkzeugleiste -->
  <div class="toolbar" id="toolbar" role="toolbar">
    <button class="tb" data-act="open" title="Datei öffnen"><svg viewBox="0 0 16 16"><path d="M1 4h5l1 1h7v8H1z" fill="#f4c542" stroke="#8a6d00"/><path d="M3 7h12l-2 6H1z" fill="#ffd966" stroke="#8a6d00"/></svg></button>
    <button class="tb" data-act="save" title="Datei speichern"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" fill="#2b4fb3" stroke="#132a6b"/><rect x="4" y="2" width="8" height="5" fill="#fff"/><rect x="4" y="10" width="8" height="4" fill="#c00"/></svg></button>
    <button class="tb" data-act="printDlg" title="Drucken"><svg viewBox="0 0 16 16"><rect x="4" y="1.5" width="8" height="5" fill="#fff" stroke="#333"/><rect x="1.5" y="6.5" width="13" height="6" fill="#bbb" stroke="#333"/><rect x="4" y="10.5" width="8" height="4" fill="#fff" stroke="#333"/></svg></button>
    <span class="sep"></span>
    <button class="tb" data-act="newSim" title="Neue Simulation"><svg viewBox="0 0 16 16"><path d="M3 1.5h7l3 3v10H3z" fill="#fff" stroke="#333"/><path d="M10 1.5v3h3" fill="none" stroke="#333"/></svg></button>
    <button class="tb" data-act="dupSim" title="Kopie der Simulation"><svg viewBox="0 0 16 16"><path d="M2 1.5h6l2 2v8H2z" fill="#fff8cc" stroke="#333"/><path d="M6 4.5h6l2 2v8H6z" fill="#fff" stroke="#333"/></svg></button>
    <button class="tb" data-act="input" title="Simulation bearbeiten"><svg viewBox="0 0 16 16"><path d="M3 1.5h10v13H3z" fill="#fff" stroke="#333"/><path d="M5 5h6M5 8h6M5 11h4" stroke="#2b4fb3"/></svg></button>
    <span class="sep"></span>
    <button class="tb toggle" data-act="showGraph" id="tbGraph" title="Schaubild"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" fill="#fff" stroke="#333"/><path d="M3 12l4-5 3 3 4-6" fill="none" stroke="#c00" stroke-width="1.4"/></svg></button>
    <button class="tb toggle" data-act="showTable" id="tbTable" title="Tabelle"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" fill="#fff" stroke="#333"/><path d="M1.5 5.5h13M1.5 9.5h13M6 1.5v13M10.5 1.5v13" stroke="#333"/><rect x="2" y="2" width="12" height="3" fill="#9cf"/></svg></button>
    <span class="sep"></span>
    <button class="tb" data-act="animStart" id="tbAnimStart" title="Animation starten"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" fill="#fff" stroke="#333"/><path d="M6 4l6 4-6 4z" fill="#14883e"/></svg></button>
    <button class="tb" data-act="animStop" id="tbAnimStop" title="Animation beenden" disabled><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" fill="#fff" stroke="#333"/><rect x="5" y="5" width="6" height="6" fill="#777"/></svg></button>
    <button class="tb" data-act="animPause" id="tbAnimPause" title="Animation Pause" disabled><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" fill="#fff" stroke="#333"/><rect x="5" y="4.5" width="2" height="7" fill="#777"/><rect x="9" y="4.5" width="2" height="7" fill="#777"/></svg></button>
    <span class="sep"></span>
    <button class="tb toggle" data-act="toolSelect" id="tbSelect" title="Objekte bearbeiten"><svg viewBox="0 0 16 16"><path d="M4 1.5v11l3-3 2 5 2-1-2-5h4z" fill="#fff" stroke="#000"/></svg></button>
    <button class="tb toggle" data-act="toolText" id="tbText" title="Text schreiben"><svg viewBox="0 0 16 16"><path d="M3 3h10v2.5M8 3v11M6 14h4M3 3v2.5" fill="none" stroke="#000" stroke-width="1.6"/></svg></button>
    <span class="sep"></span>
    <button class="tb fmt" data-fmt="bold" title="Fett"><b>F</b></button>
    <button class="tb fmt" data-fmt="italic" title="Kursiv"><i>K</i></button>
    <button class="tb fmt" data-fmt="underline" title="Unterstrichen"><u>U</u></button>
    <button class="tb fmt" data-fmt="sup" title="Hochgestellt">x²</button>
    <button class="tb fmt" data-fmt="sub" title="Tiefgestellt">x₂</button>
    <select id="fontSize" class="tbsel" title="Schriftgröße oder Karo-Format"><option>8</option><option>9</option><option>10</option><option selected>12</option><option>14</option><option>18</option><option>24</option><option>32</option><option>48</option><option>72</option></select>
    <select id="fontFamily" class="tbsel wide" title="Schriftart">
      <option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option><option value="Verdana">Verdana</option><option value="Georgia">Georgia</option>
    </select>
  </div>

  <div class="main">
    <!-- Arbeitsfläche -->
    <section class="workspace" id="workspace">
      <div class="graph-area" id="graphArea">
        <canvas id="graph" aria-label="Schaubild"></canvas>
        <div class="tip" id="tip" hidden></div>
        <textarea class="text-editor" id="textEditor" hidden spellcheck="false"></textarea>
      </div>
      <div class="table-area" id="tableArea" hidden>
        <div class="table-bar">
          <label><input type="checkbox" id="tblAll"> alle Größen</label>
          <label>jeder <input id="tblEvery" type="number" min="1" value="1"> . Wert</label>
          <button data-act="exportCsv">CSV exportieren</button>
        </div>
        <div class="table-wrap" id="tableWrap"><table id="table"></table></div>
      </div>
    </section>

    <!-- Seitenleiste -->
    <aside class="side" id="side">
      <button class="side-handle" id="sideHandle" aria-label="Seitenleiste ein-/ausklappen">Achsen ▾</button>
      <div class="side-body">
        <label class="lbl">Name der Simulation:
          <select id="simSelect"></select>
        </label>
        <label class="chk"><input type="checkbox" id="opt3d"> 3-dimensional</label>
        <label class="chk"><input type="checkbox" id="optSeparate" disabled> getrennte Schaubilder</label>
        <label class="lbl">x-Achse:
          <select id="xAxis"></select>
        </label>
        <label class="lbl" id="zWrap" hidden>y-Achse:
          <select id="zAxis"></select>
        </label>
        <div class="lbl" id="listLabel">y-Achse:</div>
        <div class="ylist" id="yList" role="listbox" aria-multiselectable="true" tabindex="0"></div>
        <div class="side-buttons">
          <button class="btn" data-act="input" id="btnInput">Eingabe</button>
          <button class="btn calc" data-act="double" id="btnWeiter" title="Weiter rechnen…"><svg viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1" fill="#ddd" stroke="#333"/><rect x="4.5" y="3" width="7" height="3" fill="#9c9"/><g fill="#333"><rect x="4.5" y="7.5" width="2" height="1.5"/><rect x="7" y="7.5" width="2" height="1.5"/><rect x="9.5" y="7.5" width="2" height="1.5"/><rect x="4.5" y="10" width="2" height="1.5"/><rect x="7" y="10" width="2" height="1.5"/><rect x="9.5" y="10" width="2" height="3.5"/><rect x="4.5" y="12.5" width="4.5" height="1.5"/></g></svg></button>
        </div>
      </div>
    </aside>
  </div>

  <footer class="statusbar" id="status">Klicken Sie auf die Kurve oder Achse, die bearbeitet werden soll.</footer>
</div>

<!-- Eingabemaske -->
<dialog class="dlg mask" id="maskDlg" aria-label="Algorithmische Modellierung">
  <form method="dialog" class="mask-form" id="maskForm">
    <div class="mask-top">
      <label>Wiederhole <input type="number" id="mReps" min="1" max="10000000" step="1" value="100" title="Anzahl der berechneten Werte"> mal</label>
      <label>Name der Simulation: <input id="mName" maxlength="64"></label>
    </div>
    <div class="mask-body">
      <div class="mask-left">
        <button type="button" class="mtab back" id="mTabText" title="Zurück zum Programm">◂ Programm</button>
        <div class="editor-wrap">
          <div class="gutter" id="mGutter" aria-hidden="true"></div>
          <textarea id="mText" title="Programmschleife" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
        </div>
        <div class="graphic-model" id="mGraphic" hidden></div>
        <div class="mask-err" id="mErr" role="alert"></div>
      </div>
      <div class="mask-right">
        <div class="sv-title">Startwerte:</div>
        <div class="sv-grid" id="mStart"></div>
        <label class="chk"><input type="checkbox" id="mCase"> Groß-, Kleinschreibung</label>
        <button type="button" class="btn mbtn" id="mTabVerbal">Sprachliches Modell</button>
        <button type="button" class="btn mbtn" id="mTabGraphic">Grafisches Modell</button>
      </div>
    </div>
    <div class="mask-bottom">
      <button type="submit" class="btn ok" value="ok"><span class="ico ok-ico">✔</span> OK</button>
      <button type="button" class="btn" id="mCancel"><span class="ico x-ico">✘</span> Abbrechen</button>
      <button type="button" class="btn" id="mHelp"><span class="ico q-ico">?</span> Hilfe</button>
    </div>
  </form>
</dialog>

<!-- Allgemeiner Dialog (Achse, Kurve, Hilfe …) -->
<dialog class="dlg small" id="genDlg">
  <form method="dialog" id="genForm">
    <h2 id="genTitle"></h2>
    <div id="genBody"></div>
    <div class="dlg-buttons" id="genButtons">
      <button type="submit" class="btn ok" value="ok">OK</button>
      <button type="submit" class="btn" value="cancel" formnovalidate>Abbrechen</button>
      <button type="button" class="btn" id="genHelp" hidden>Hilfe</button>
    </div>
  </form>
</dialog>

<input type="file" id="fileInput" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>
<div id="printArea" class="print-area"></div>

<script src="js/parser.js"></script>
<script src="js/prg.js"></script>
<script src="js/prg-writer.js"></script>
<script src="js/examples.js"></script>
<script src="js/app.js"></script>
</body>
</html>
